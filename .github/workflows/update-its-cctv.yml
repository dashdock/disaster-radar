name: 국가교통정보센터 CCTV 갱신
on:
  workflow_dispatch:
  schedule:
    - cron: "12 18 * * *"
permissions:
  contents: write
concurrency:
  group: update-its-cctv
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CCTV 화상자료 수집
        env:
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
        run: node backend/fetch-its-cctv.mjs
      - name: 변경 데이터 커밋
        run: |
          git config user.name "disaster-radar-bot"
          git config user.email "disaster-radar-bot@users.noreply.github.com"
          git add data/cctv-metadata.json
          if git diff --cached --quiet; then
            echo "변경된 CCTV 자료가 없습니다."
          else
            git commit -m "[수정] 국가교통정보센터 CCTV 갱신"
            git push
          fi
