<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

<style>
  :root {
    --bg: #0B1220;
    --panel: #121B2E;
    --panel-inner: #0E1728;
    --border: #22314A;
    --text: #E8EDF5;
    --text-dim: #8A9BB8;
    --text-faint: #5A6C8A;
    --blue: #4C8DFF;
    --yellow: #FFC53D;
    --orange: #FF8A3D;
    --red: #FF4D4D;
  }
  * { box-sizing: border-box; }
  body, .rd-root { margin: 0; }
  .rd-root {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    padding: 20px;
  }
  .rd-mono { font-family: 'SF Mono','Consolas','JetBrains Mono',monospace; letter-spacing: 0.02em; }

  .rd-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .rd-brand { display: flex; align-items: center; gap: 10px; }
  .rd-brand-icon { width: 34px; height: 34px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  .rd-brand-title { font-size: 16px; font-weight: 700; letter-spacing: 0.01em; }
  .rd-brand-sub { font-size: 11px; color: var(--text-dim); }

  .rd-search-wrap { position: relative; flex: 1 1 260px; max-width: 360px; }
  .rd-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; pointer-events: none; }
  .rd-search-input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px 9px 32px; color: var(--text); font-size: 13px; outline: none;
  }
  .rd-search-dropdown { position: absolute; top: 110%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; z-index: 500; display: none; }
  .rd-search-item { padding: 8px 12px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; }
  .rd-search-item:hover { background: #1A2740; }

  .rd-clock { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }

  .rd-legend-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .rd-legend-caption { font-size: 10.5px; color: var(--text-faint); width: 64px; flex-shrink: 0; }
  .rd-legend { display: flex; gap: 10px; flex-wrap: wrap; }
  .rd-legend-item { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 11.5px; color: var(--text-dim); }
  .rd-legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .rd-legends-wrap { margin-bottom: 16px; }

  .rd-main { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(280px,1fr); gap: 16px; }
  .rd-map-panel { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .rd-map-caption { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  #rd-map { height: 540px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }

  .rd-detail-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .rd-detail-label { font-size: 11px; color: var(--text-dim); }
  .rd-detail-name-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .rd-detail-name { font-size: 20px; font-weight: 700; }
  .rd-level-badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; }

  .rd-row-label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); margin-bottom: 4px; }
  .rd-row-value { font-size: 13.5px; color: var(--text); padding-left: 21px; }

  .rd-alerts-title { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); margin-bottom: 8px; }
  .rd-alert-item { font-size: 11.5px; color: #C6D0E2; background: var(--panel-inner); border: 1px solid #1E2A42; border-radius: 6px; padding: 7px 10px; }
  .rd-alerts-list { display: flex; flex-direction: column; gap: 7px; }

  .rd-ticker { margin-top: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 0; display: flex; align-items: center; overflow: hidden; }
  .rd-ticker-live { display: flex; align-items: center; gap: 6px; padding: 0 14px; flex-shrink: 0; border-right: 1px solid var(--border); }
  .rd-ticker-track-wrap { overflow: hidden; flex: 1; margin-left: 14px; }
  .rd-ticker-track { display: inline-flex; white-space: nowrap; animation: marquee 26s linear infinite; }
  .rd-ticker-item { font-size: 12px; color: #C6D0E2; margin-right: 40px; }

  .rd-footnote { margin-top: 14px; font-size: 10.5px; color: var(--text-faint); text-align: center; }

  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes pulse-ring {
    0% { transform: scale(0.6); opacity: 0.9; }
    70% { transform: scale(2.4); opacity: 0; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .rd-marker-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #0B1220; position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .rd-marker-ring { position: absolute; top: 50%; left: 50%; width: 26px; height: 26px; border-radius: 50%; transform: translate(-50%, -50%); animation: pulse-ring 1.8s ease-out infinite; z-index: 1; }
  .rd-marker-wrap.selected .rd-marker-dot { box-shadow: 0 0 0 4px rgba(255,255,255,0.2); }
  .rd-type-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; border-radius: 999px; padding: 2px 9px; }

  /* Leaflet dark theme overrides */
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-content { font-family: inherit; font-size: 12.5px; margin: 10px 12px; }
  .leaflet-container { background: var(--bg); }
</style>

</div>

  // Clock
  function formatClock(d) {
    const days = ["일","월","화","수","목","금","토"];
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}(${days[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} KST`;
  }
  const clockEl = document.getElementById("rd-clock");
  function tickClock() { clockEl.textContent = formatClock(new Date()); }
  tickClock();
  setInterval(tickClock, 1000);

  // Map
  const map = L.map("rd-map", { zoomControl: true, attributionControl: true }).setView([36.4, 127.9], 7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: "abcd",
    maxZoom: 19,
  }).addTo(map);

  function makeIcon(region, isSelected) {
    const color = LEVEL_COLORS[region.level];
    const showRing = region.level === "경계" || region.level === "심각";
    const typeIcon = TYPE_META[region.type] ? TYPE_META[region.type].icon : "✅";
    return L.divIcon({
      className: "",
      html: `
        <div class="rd-marker-wrap ${isSelected ? "selected" : ""}" style="position:relative;width:26px;height:26px;">
          ${showRing ? `<div class="rd-marker-ring" style="background:${color};"></div>` : ""}
          <div class="rd-marker-dot" style="background:${color};box-shadow:0 0 6px ${color};">${typeIcon}</div>
        </div>
      `,
      iconSize: [26, 26],
      iconAnchor: [13, 13],
    });
  }

  REGIONS.forEach(region => {
    const marker = L.marker([region.lat, region.lng], { icon: makeIcon(region, region.id === selectedId) })
      .addTo(map)
      .bindPopup(`<strong>${region.name}</strong><br/>${TYPE_META[region.type].icon} ${TYPE_META[region.type].label} · ${LEVEL_LABEL[region.level]}<br/>${region.cond} ${region.temp}°C`);
    marker.on("click", () => selectRegion(region.id, true));
    markers[region.id] = marker;
  });

  function renderDetail(region) {
    const color = LEVEL_COLORS[region.level];
    const detailEl = document.getElementById("rd-detail");
    detailEl.innerHTML = `
      <div>
        <div class="rd-detail-label">선택 지역</div>
        <div class="rd-detail-name-row">
          <div class="rd-detail-name">${region.name}</div>
          <div class="rd-level-badge rd-mono" style="color:${color};border:1px solid ${color}55;">${LEVEL_LABEL[region.level]}</div>
        </div>
      </div>
      <div>
        <div class="rd-row-label">⚠ 재난 유형 · 단계</div>
        <div class="rd-row-value">
          <span class="rd-type-badge" style="background:${color}22;color:${color};">${TYPE_META[region.type].icon} ${TYPE_META[region.type].label}</span>
          <span class="rd-type-badge rd-mono" style="border:1px solid ${color}55;color:${color};margin-left:6px;">${LEVEL_LABEL[region.level]}</span>
        </div>
      </div>
      <div>
        <div class="rd-row-label">🌤 실시간 기상</div>
        <div class="rd-row-value">${region.cond} · ${region.temp}°C · 강수확률 ${region.precip}%</div>
      </div>
      <div>
        <div class="rd-row-label">🛡 감염병 특이사항</div>
        <div class="rd-row-value">${region.epidemic}</div>
      </div>
      <div>
        <div class="rd-row-label">✈ 드론 비행 정보</div>
        <div class="rd-row-value">${region.drone}</div>
      </div>
      <div>
        <div class="rd-alerts-title">📰 최근 알림</div>
        <div class="rd-alerts-list">
          ${region.alerts.map(a => `
            <div class="rd-alert-item rd-mono" style="display:flex;align-items:center;gap:8px;">
              <span>${TYPE_META[a.type].icon}</span>
              <span>${a.time}</span>
              <span>${a.text}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  function selectRegion(id, fly) {
    const prev = selectedId;
    selectedId = id;
    const region = REGIONS.find(r => r.id === id);
    if (markers[prev]) markers[prev].setIcon(makeIcon(REGIONS.find(r => r.id === prev), false));
    markers[id].setIcon(makeIcon(region, true));
    if (fly) {
      map.flyTo([region.lat, region.lng], Math.max(map.getZoom(), 9), { duration: 0.6 });
      markers[id].openPopup();
    }
    renderDetail(region);
  }

  renderDetail(REGIONS.find(r => r.id === selectedId));

  // Search
  const searchInput = document.getElementById("rd-search");
  const dropdown = document.getElementById("rd-search-dropdown");

  function renderDropdown(matches) {
    if (!matches.length) { dropdown.style.display = "none"; return; }
    dropdown.innerHTML = matches.slice(0, 5).map(r => `
      <div class="rd-search-item" data-id="${r.id}">
        <span>${TYPE_META[r.type].icon} ${r.name}</span>
        <span style="color:${LEVEL_COLORS[r.level]};font-size:11px;">${LEVEL_LABEL[r.level]}</span>
      </div>
    `).join("");
    dropdown.style.display = "block";
    dropdown.querySelectorAll(".rd-search-item").forEach(el => {
      el.addEventListener("click", () => {
        selectRegion(el.getAttribute("data-id"), true);
        searchInput.value = "";
        dropdown.style.display = "none";
      });
    });
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    if (!q) { dropdown.style.display = "none"; return; }
    renderDropdown(REGIONS.filter(r => r.name.includes(q)));
  });

  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const q = searchInput.value.trim();
      const match = REGIONS.find(r => r.name.includes(q));
      if (match) {
        selectRegion(match.id, true);
        searchInput.value = "";
        dropdown.style.display = "none";
      }
    }
  });

  document.addEventListener("click", (e) => {
    if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.style.display = "none";
    }
  });
})();
</script>
