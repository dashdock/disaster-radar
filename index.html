    { id:"jeju", name:"제주", lat:33.4996, lng:126.5312, level:"심각", type:"태풍", temp:26, cond:"태풍 직접영향", precip:95,
      epidemic:"특이사항 없음", drone:"전 지역 비행금지 · 태풍 통과중",
      alerts:[{time:"14:15",type:"태풍",text:"태풍경보 발효 · 즉시 대피 권고"},{time:"13:00",type:"태풍",text:"항공편 전편 결항"},{time:"11:20",type:"태풍",text:"해안도로 전면 통제"}] },
  ];

  const TICKER_ITEMS = [
    "🌀 [제주] 태풍경보 발효 · 항공편 전편 결항",
    "🌊 [전남 여수] 호우경계경보 발효 · 해안 저지대 대피 권고",
    "🌊 [경북 포항] 호우주의보 발효 · 하천 급류 유의",
    "⛰️ [강원 평창] 산사태주의보 발효",
    "📳 [충북 괴산] 규모 3.2 지진 발생 · 여진 주의",
    "🔥 [대구] 폭염주의보 발효 · 온열질환 유의",
    "💨 [부산] 강풍주의보 · 해안도로 통제 구간 발생",
  ];

  let selectedId = "seoul";
  const markers = {};
  const WATCHED_REGIONS_KEY = "disaster-radar-watched-regions";
  const NOTIFIED_SENSOR_EVENTS_KEY = "disaster-radar-notified-sensor-events";
  const SENSOR_STATUS_COLORS = {
    정상: "#20A47A", 관심: "#4C8DFF", 주의: "#E9A800", 경계: "#FF8A3D", 심각: "#FF4D4D", 통신두절: "#98A2B3",
  };
  const sensorLayer = L.layerGroup();
  let sensorStations = [];
  let sensorsVisible = true;
  let radarLayer = null;
  let radarVisible = false;
  const locationCache = new Map();

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
    })[character]);
  }

  function getStoredSet(key) {
    try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); }
    catch { return new Set(); }
  }

  function storeSet(key, set) {
    localStorage.setItem(key, JSON.stringify([...set]));
  }

  function formatObservedAt(value) {
    if (!/^\d{12}$/.test(value || "")) return "수신 정보 없음";
    return `${value.slice(0,4)}.${value.slice(4,6)}.${value.slice(6,8)} ${value.slice(8,10)}:${value.slice(10,12)}`;
  }

  // Legend
  const legendEl = document.getElementById("rd-legend");
  const counts = { 관심: 0, 주의: 0, 경계: 0, 심각: 0 };
  REGIONS.forEach(r => counts[r.level]++);
  legendEl.innerHTML = Object.entries(LEVEL_LABEL).map(([key, label]) => `
    <div class="rd-legend-item">
      <span class="rd-legend-dot" style="background:${LEVEL_COLORS[key]};box-shadow:0 0 6px ${LEVEL_COLORS[key]};"></span>
      ${label} <span style="color:var(--text);">· ${counts[key]}개 지역</span>
    </div>
  `).join("");

  const typeLegendEl = document.getElementById("rd-type-legend");
  const activeTypes = [...new Set(REGIONS.map(r => r.type).filter(t => t && t !== "없음"))];
  typeLegendEl.innerHTML = activeTypes.map(key => `
    <div class="rd-legend-item">
      <span>${TYPE_META[key].icon}</span> ${TYPE_META[key].label}
      <span style="color:var(--text);">· ${REGIONS.filter(r => r.type === key).length}개 지역</span>
    </div>
  `).join("");

  // Ticker
  const trackEl = document.getElementById("rd-ticker-track");
  const dup = [...TICKER_ITEMS, ...TICKER_ITEMS];
  trackEl.innerHTML = dup.map(t => `<span class="rd-ticker-item rd-mono">${t}</span>`).join("");

  // Clock
  function formatClock(d) {
    const days = ["일","월","화","수","목","금","토"];
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}(${days[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} KST`;
  }
  const clockEl = document.getElementById("rd-clock");
  function tickClock() { clockEl.textContent = formatClock(new Date()); }
  tickClock();
  setInterval(tickClock, 1000);

  // Map
  const map = L.map("rd-map", {
    zoomControl: true,
    attributionControl: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
  }).setView([36.4, 127.9], 7);
  const streetLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  });
  const satelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
    maxZoom: 19,
  });
  streetLayer.addTo(map);
  L.control.layers({
    "🗺 일반 지도": streetLayer,
    "🛰 위성 지도": satelliteLayer,
  }, null, { collapsed: false, position: "topright" }).addTo(map);

  async function loadLatestRadar() {
    const button = document.getElementById("rd-radar-toggle");
    try {
      const response = await fetch("https://api.rainviewer.com/public/weather-maps.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const weatherMaps = await response.json();
      const frames = weatherMaps.radar?.past || [];
      const latestFrame = frames[frames.length - 1];
      if (!latestFrame) throw new Error("No radar frame available");
      if (radarLayer) radarLayer.removeFrom(map);
      radarLayer = L.tileLayer(`${weatherMaps.host}${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
        opacity: 0.68,
        maxNativeZoom: 7,
        maxZoom: 19,
        zIndex: 300,
        attribution: "Weather radar &copy; RainViewer",
      });
      if (radarVisible) radarLayer.addTo(map);
      const observedAt = new Date(latestFrame.time * 1000).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      button.textContent = radarVisible ? `🌧 강수 레이더 ${observedAt}` : "🌧 강수 레이더 켜기";
      button.title = `최신 레이더 프레임: ${observedAt}`;
    } catch (error) {
      button.textContent = "🌧 강수 레이더 불러오기 실패";
      button.classList.remove("active");
      radarVisible = false;
      console.error("Failed to load precipitation radar", error);
    }
  }

  document.getElementById("rd-radar-toggle").addEventListener("click", async () => {
    radarVisible = !radarVisible;
    const button = document.getElementById("rd-radar-toggle");
    button.classList.toggle("active", radarVisible);
    if (!radarLayer) await loadLatestRadar();
    else if (radarVisible) radarLayer.addTo(map);
    else {
      radarLayer.removeFrom(map);
      button.textContent = "🌧 강수 레이더 켜기";
    }
  });

  function administrativePath(address) {
    return [...new Set([
      address.state,
      address.city || address.county,
      address.city_district || address.borough,
      address.town || address.village || address.suburb,
      address.quarter || address.neighbourhood,
    ].filter(Boolean))];
  }

  map.on("click", async event => {
    if (event.sourceTarget !== map) return;
    if (map.getZoom() < 11) {
      L.popup().setLatLng(event.latlng).setContent("<strong>읍·면·동 확인</strong><br>지도를 11단계 이상 확대한 뒤 위치를 눌러주세요.").openOn(map);
      return;
    }
    const cacheKey = `${event.latlng.lat.toFixed(4)},${event.latlng.lng.toFixed(4)}`;
    const popup = L.popup().setLatLng(event.latlng).setContent("행정구역 확인 중…").openOn(map);
    try {
      let place = locationCache.get(cacheKey);
      if (!place) {
        const params = new URLSearchParams({
          format: "jsonv2",
          lat: event.latlng.lat,
          lon: event.latlng.lng,
          zoom: 18,
          addressdetails: 1,
          "accept-language": "ko",
        });
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?${params}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        place = await response.json();
        locationCache.set(cacheKey, place);
      }
      const address = place.address || {};
      const path = administrativePath(address);
      const locality = address.neighbourhood || address.quarter || address.suburb || address.village || address.town || address.city_district || address.county || "행정동 정보 없음";
      popup.setContent(`
        <div class="rd-location-popup">
          <strong>📍 ${escapeHtml(locality)}</strong>
          <div class="rd-location-path">${escapeHtml(path.join(" · ") || place.display_name)}</div>
          <div style="margin-top:5px;font-size:10px;color:var(--text-faint);">위도 ${event.latlng.lat.toFixed(5)} · 경도 ${event.latlng.lng.toFixed(5)}</div>
        </div>`);
    } catch (error) {
      popup.setContent("행정구역 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
      console.error("Failed to reverse geocode map location", error);
    }
  });

  function makeIcon(region, isSelected) {
    const color = LEVEL_COLORS[region.level];
    const showRing = region.level === "경계" || region.level === "심각";
    const typeIcon = TYPE_META[region.type] ? TYPE_META[region.type].icon : "✅";
    return L.divIcon({
      className: "",
      html: `
        <div class="rd-marker-wrap ${isSelected ? "selected" : ""}" style="position:relative;width:26px;height:26px;">
          ${showRing ? `<div class="rd-marker-ring" style="background:${color};"></div>` : ""}
          <div class="rd-marker-dot" style="background:${color};box-shadow:0 0 6px ${color};">${typeIcon}</div>
        </div>
      `,
      iconSize: [26, 26],
      iconAnchor: [13, 13],
    });
  }

  REGIONS.forEach(region => {
    const marker = L.marker([region.lat, region.lng], { icon: makeIcon(region, region.id === selectedId) })
      .addTo(map)
      .bindPopup(`<strong>${region.name}</strong><br/>${TYPE_META[region.type].icon} ${TYPE_META[region.type].label} · ${LEVEL_LABEL[region.level]}<br/>${region.cond} ${region.temp}°C`);
    marker.on("click", () => selectRegion(region.id, true));
    markers[region.id] = marker;
  });

  sensorLayer.addTo(map);

  function showAlertBanner(alerts) {
    const banner = document.getElementById("rd-alert-banner");
    const text = document.getElementById("rd-alert-banner-text");
    if (!alerts.length) {
      banner.classList.remove("show");
      return;
    }
    const first = alerts[0];
    text.textContent = `⚠ 관심 지역 수위 경고: ${first.name} ${first.waterLevel}m (${first.status})${alerts.length > 1 ? ` 외 ${alerts.length - 1}건` : ""}`;
    banner.classList.add("show");
  }

  function checkWatchedRegionAlerts(stations) {
    const watchedRegions = getStoredSet(WATCHED_REGIONS_KEY);
    const alertLevels = new Set(["관심", "주의", "경계", "심각"]);
    const alerts = stations.filter(station => watchedRegions.has(station.regionId) && alertLevels.has(station.status));
    showAlertBanner(alerts);

    const notifiedEvents = getStoredSet(NOTIFIED_SENSOR_EVENTS_KEY);
    alerts.forEach(station => {
      const eventId = `${station.code}:${station.observedAt}:${station.status}`;
      if (notifiedEvents.has(eventId)) return;
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`수위 ${station.status} · ${station.name}`, {
          body: `현재 ${station.waterLevel}m · ${formatObservedAt(station.observedAt)}`,
          icon: "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2250%22>💧</text></svg>",
        });
      }
      notifiedEvents.add(eventId);
    });
    storeSet(NOTIFIED_SENSOR_EVENTS_KEY, new Set([...notifiedEvents].slice(-300)));
  }

  function renderWaterSensors(stations) {
    sensorLayer.clearLayers();
    stations.forEach(station => {
      const color = SENSOR_STATUS_COLORS[station.status] || SENSOR_STATUS_COLORS.통신두절;
      const isAlert = !["정상", "통신두절"].includes(station.status);
      const marker = L.circleMarker([station.lat, station.lng], {
        radius: isAlert ? 6 : 3,
        color: "#FFFFFF",
        weight: 1,
        fillColor: color,
        fillOpacity: station.status === "통신두절" ? 0.45 : 0.82,
      }).bindTooltip(`${escapeHtml(station.name)} · ${station.waterLevel == null ? "수신 없음" : `${station.waterLevel}m`} · ${escapeHtml(station.status)}`);
      marker.on("click", () => {
        selectRegion(station.regionId, false);
        renderSensorDetail(station);
      });
      marker.addTo(sensorLayer);
    });
  }

  async function loadWaterSensors() {
    const toggle = document.getElementById("rd-sensor-toggle");
    try {
      const response = await fetch(`data/water-levels.json?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      sensorStations = Array.isArray(payload.stations) ? payload.stations : [];
      renderWaterSensors(sensorStations);
      const activeCount = sensorStations.filter(station => station.waterLevel != null).length;
      toggle.textContent = `💧 수위 센서 ${activeCount.toLocaleString()}개 · 10분 갱신`;
      toggle.title = `데이터 생성: ${new Date(payload.generatedAt).toLocaleString("ko-KR")}`;
      checkWatchedRegionAlerts(sensorStations);
    } catch (error) {
      toggle.textContent = "💧 수위 센서 불러오기 실패";
      toggle.classList.remove("active");
      console.error("Failed to load water-level sensors", error);
    }
  }

  const sensorToggle = document.getElementById("rd-sensor-toggle");
  sensorToggle.addEventListener("click", () => {
    sensorsVisible = !sensorsVisible;
    if (sensorsVisible) sensorLayer.addTo(map);
    else sensorLayer.removeFrom(map);
    sensorToggle.classList.toggle("active", sensorsVisible);
  });

  document.getElementById("rd-alert-banner-close").addEventListener("click", () => {
    document.getElementById("rd-alert-banner").classList.remove("show");
  });

  function renderDetail(region) {
    const color = LEVEL_COLORS[region.level];
    const detailEl = document.getElementById("rd-detail");
    detailEl.innerHTML = `
      <div>
        <div class="rd-detail-label">선택 지역</div>
        <div class="rd-detail-name-row">
          <div class="rd-detail-name">${region.name}</div>
          <div class="rd-level-badge rd-mono" style="color:${color};border:1px solid ${color}55;">${LEVEL_LABEL[region.level]}</div>
        </div>
        <button type="button" class="rd-watch-button" id="rd-watch-button" data-region-id="${region.id}"></button>
      </div>
      <div>
        <div class="rd-row-label">⚠ 재난 유형 · 단계</div>
        <div class="rd-row-value">
          <span class="rd-type-badge" style="background:${color}22;color:${color};">${TYPE_META[region.type].icon} ${TYPE_META[region.type].label}</span>
          <span class="rd-type-badge rd-mono" style="border:1px solid ${color}55;color:${color};margin-left:6px;">${LEVEL_LABEL[region.level]}</span>
        </div>
      </div>
      <div>
        <div class="rd-row-label">🌤 실시간 기상</div>
        <div class="rd-row-value">${region.cond} · ${region.temp}°C · 강수확률 ${region.precip}%</div>
      </div>
      <div>
        <div class="rd-row-label">🛡 감염병 특이사항</div>
        <div class="rd-row-value">${region.epidemic}</div>
      </div>
      <div>
        <div class="rd-row-label">✈ 드론 비행 정보</div>
        <div class="rd-row-value">${region.drone}</div>
      </div>
      <div id="rd-sensor-detail"></div>
      <div>
        <div class="rd-alerts-title">📰 최근 알림</div>
        <div class="rd-alerts-list">
          ${region.alerts.map(a => `
            <div class="rd-alert-item rd-mono" style="display:flex;align-items:center;gap:8px;">
              <span>${TYPE_META[a.type].icon}</span>
              <span>${a.time}</span>
              <span>${a.text}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
    bindWatchButton(region);
  }

  function bindWatchButton(region) {
    const button = document.getElementById("rd-watch-button");
    const watchedRegions = getStoredSet(WATCHED_REGIONS_KEY);
    const render = () => {
      const active = watchedRegions.has(region.id);
      button.classList.toggle("active", active);
      button.textContent = active ? "★ 관심 지역 등록됨 · 해제" : "☆ 관심 지역으로 등록";
    };
    render();
    button.addEventListener("click", async () => {
      if (watchedRegions.has(region.id)) watchedRegions.delete(region.id);
      else {
        watchedRegions.add(region.id);
        if ("Notification" in window && Notification.permission === "default") {
          await Notification.requestPermission();
        }
      }
      storeSet(WATCHED_REGIONS_KEY, watchedRegions);
      render();
      checkWatchedRegionAlerts(sensorStations);
    });
  }

  function renderSensorDetail(station) {
    const detail = document.getElementById("rd-sensor-detail");
    if (!detail) return;
    const color = SENSOR_STATUS_COLORS[station.status] || SENSOR_STATUS_COLORS.통신두절;
    const thresholds = Object.entries(station.thresholds || {})
      .filter(([, value]) => value != null)
      .map(([level, value]) => `${level} ${value}m`).join(" · ") || "공식 기준 미설정";
    detail.innerHTML = `
      <div class="rd-sensor-card">
        <div class="rd-sensor-card-title">
          <span>💧 ${escapeHtml(station.name)}</span>
          <span style="color:${color};">${escapeHtml(station.status)}</span>
        </div>
        <div class="rd-sensor-grid">
          <div>현재 수위<span class="rd-sensor-value">${station.waterLevel == null ? "-" : `${station.waterLevel}m`}</span></div>
          <div>관측 시각<span class="rd-sensor-value">${escapeHtml(formatObservedAt(station.observedAt))}</span></div>
        </div>
        <div style="font-size:10.5px;color:var(--text-dim);margin-top:9px;">${escapeHtml(station.address)}</div>
        <div style="font-size:10.5px;color:var(--text-dim);margin-top:4px;">경보 기준: ${escapeHtml(thresholds)}</div>
      </div>`;
  }

  function selectRegion(id, fly) {
    const prev = selectedId;
    selectedId = id;
    const region = REGIONS.find(r => r.id === id);
    if (markers[prev]) markers[prev].setIcon(makeIcon(REGIONS.find(r => r.id === prev), false));
    markers[id].setIcon(makeIcon(region, true));
    if (fly) {
      map.flyTo([region.lat, region.lng], Math.max(map.getZoom(), 9), { duration: 0.6 });
      markers[id].openPopup();
    }
    renderDetail(region);
  }

  renderDetail(REGIONS.find(r => r.id === selectedId));

  // Search
  const searchInput = document.getElementById("rd-search");
  const dropdown = document.getElementById("rd-search-dropdown");

  function renderDropdown(matches) {
    if (!matches.length) { dropdown.style.display = "none"; return; }
    dropdown.innerHTML = matches.slice(0, 5).map(r => `
      <div class="rd-search-item" data-id="${r.id}">
        <span>${TYPE_META[r.type].icon} ${r.name}</span>
        <span style="color:${LEVEL_COLORS[r.level]};font-size:11px;">${LEVEL_LABEL[r.level]}</span>
      </div>
    `).join("");
    dropdown.style.display = "block";
    dropdown.querySelectorAll(".rd-search-item").forEach(el => {
      el.addEventListener("click", () => {
        selectRegion(el.getAttribute("data-id"), true);
        searchInput.value = "";
        dropdown.style.display = "none";
      });
    });
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    if (!q) { dropdown.style.display = "none"; return; }
    renderDropdown(REGIONS.filter(r => r.name.includes(q)));
  });

  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const q = searchInput.value.trim();
      const match = REGIONS.find(r => r.name.includes(q));
      if (match) {
        selectRegion(match.id, true);
        searchInput.value = "";
        dropdown.style.display = "none";
      }
    }
  });

  document.addEventListener("click", (e) => {
    if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.style.display = "none";
    }
  });

  loadWaterSensors();
  setInterval(loadWaterSensors, 10 * 60 * 1000);
  loadLatestRadar();
  setInterval(loadLatestRadar, 5 * 60 * 1000);
})();
</script>
